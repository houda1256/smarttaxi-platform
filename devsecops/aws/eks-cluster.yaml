apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: smarttaxi-eks
  region: eu-north-1
  version: "1.34"

vpc:
  id: vpc-06b54a72063da4e16
  subnets:
    public:
      eu-north-1a:
        id: subnet-0407b10b671f816d1
      eu-north-1b:
        id: subnet-0e33d36bdeeb8c7e81

managedNodeGroups:
  - name: smarttaxi-workers
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 2

    volumeSize: 20
    volumeType: gp3

    privateNetworking: false

    labels:
      project: smarttaxi
      environment: dev

    tags:
      Project: SmartTaxi
      Environment: Dev

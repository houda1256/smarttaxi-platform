name: Backend CI

on:
  push:
    branches:
      - main
      - feature/identity-authentication

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore dependencies
        run: dotnet restore backend/SmartTaxiBackend.slnx

      - name: Build solution
        run: dotnet build backend/SmartTaxiBackend.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/SmartTaxiBackend.slnx --configuration Release --no-build

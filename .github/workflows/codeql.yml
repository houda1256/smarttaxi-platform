name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - feature/identity-authentication

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: Analyze C# Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore dependencies
        run: dotnet restore backend/SmartTaxiBackend.slnx

      - name: Build solution
        run: dotnet build backend/SmartTaxiBackend.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/SmartTaxiBackend.slnx --configuration Release --no-build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
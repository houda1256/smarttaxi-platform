name: CD - Deploy SmartTaxi API to EKS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/cd-eks.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: smarttaxi-api
  EKS_CLUSTER: smarttaxi-eks
  K8S_NAMESPACE: default
  DEPLOYMENT_NAME: smarttaxi-api
  CONTAINER_NAME: smarttaxi-api

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::397291427673:role/SmartTaxi-GitHubActions-CD-Role
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "397291427673"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy image to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/$DEPLOYMENT_NAME \
            $CONTAINER_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -n $K8S_NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/$DEPLOYMENT_NAME \
            -n $K8S_NAMESPACE \
            --timeout=300s

      - name: Verify deployed image
        run: |
          kubectl get deployment/$DEPLOYMENT_NAME \
            -n $K8S_NAMESPACE \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
